name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  stable:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: Release packages
          commit: Release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: registry
        if: steps.changesets.outputs.hasChangesets == 'false'
        name: Check published version
        shell: bash
        run: |
          package_ref="$(node -p "const packageJson = require('./package.json'); packageJson.name + '@' + packageJson.version")"
          if registry_result="$(npm view "$package_ref" version --json 2>&1)"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "\`$package_ref\` is already published." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$registry_result" == *"E404"* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$registry_result" >&2
            exit 1
          fi
      - if: steps.registry.outputs.publish == 'true'
        run: pnpm release

  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm changeset version --snapshot preview
      - run: pnpm install --lockfile-only --ignore-scripts
      - run: npm publish --provenance --access public --tag preview
      - name: Write install command
        run: echo 'Install with `npm install dsh-bundle-builder@preview`.' >> "$GITHUB_STEP_SUMMARY"
